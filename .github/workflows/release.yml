name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run cross-platform test suites
        run: |
          dotnet test tests/LogiBoltTray.Protocol.Tests
          dotnet test tests/LogiBoltTray.Core.Tests

      - name: Publish self-contained single-file exe
        run: dotnet publish src/LogiBoltTray.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Zip published output
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath LogiBoltTray-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogiBoltTray-win-x64
          path: LogiBoltTray-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LogiBoltTray-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
